name: Update and deploy investment dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [all, cn, us]
        default: all
        description: Market to refresh
  schedule:
    # GitHub schedule is best effort: use non-round minutes and retry later.
    # The exchange calendar and close+30-minute gate decide the eligible session.
    - cron: '37 7 * * 1-5'
    - cron: '53 7 * * 1-5'
    - cron: '17 8 * * 1-5'
    - cron: '43 9 * * 1-5'
    - cron: '13 12 * * 1-5'
    # New York close+30 minutes is 20:30/21:30 UTC across DST.
    - cron: '37 20 * * 1-5'
    - cron: '53 20 * * 1-5'
    - cron: '17 21 * * 1-5'
    - cron: '37 21 * * 1-5'
    - cron: '53 21 * * 1-5'
    - cron: '17 22 * * 1-5'
    - cron: '13 0 * * 2-6'
permissions:
  contents: write
concurrency:
  group: investment-dashboard-publish
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install trading calendars
        run: pip install -r requirements.txt
      - name: Validate rules and data handling
        run: |
          node --test tests/*.test.mjs
          python tests/calendar_test.py
      - name: Resolve last completed trading session and next close
        run: python scripts/market_calendar.py
      - name: Refresh close data with validation
        id: refresh
        continue-on-error: true
        env:
          REQUESTED_MARKET: ${{ inputs.market || 'all' }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          market="$REQUESTED_MARKET"
          case "$SCHEDULE" in
            '37 7 * * 1-5'|'53 7 * * 1-5'|'17 8 * * 1-5'|'43 9 * * 1-5'|'13 12 * * 1-5') market=cn ;;
            '') ;;
            *) market=us ;;
          esac
          node scripts/update-price-map.mjs "$market" || price_status=$?
          if [ "${price_status:-0}" != "0" ]; then exit 1; fi
      - name: Refresh independent market sentiment module
        if: github.event.schedule != '30 7 * * 1-5' && github.event.schedule != '50 7 * * 1-5' && github.event.schedule != '10 8 * * 1-5' && github.event.schedule != '30 10 * * 1-5' && github.event.schedule != '30 12 * * 1-5'
        continue-on-error: true
        run: node scripts/update-market-data.mjs
      - name: Rebuild embedded offline snapshot
        run: node scripts/build-map.mjs
      - name: Commit actual data dates and update status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/price-map.json data/market-sentiment.json seed.js
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh validated market closes and status'
            git pull --rebase origin main
            git push
          fi
      - name: Report incomplete market update
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Some index closes were not verified. Previous values and actual dates remain published; check data/price-map.json.'
          exit 1
