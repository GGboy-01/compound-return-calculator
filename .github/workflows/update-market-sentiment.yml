name: Update market sentiment

on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * 1-5'
      timezone: 'America/New_York'
    - cron: '17 19 * * 1-5'
      timezone: 'America/New_York'
    - cron: '30 0 * * 2-6'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: update-market-sentiment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Cboe and FRED closing data
        run: node scripts/update-market-data.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/market-sentiment.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-sentiment.json
          git commit -m "data: update market and index closes"
          git pull --rebase origin main
          git push

