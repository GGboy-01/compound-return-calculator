<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投资决策实验室 · V8 · R1</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="r1-layout.css"></head><body>
<header><div class="brand"><span class="logo">↗</span><div><h1>投资决策实验室 <em>V8 · R1</em></h1><p>每日行动优先 · 金额与比例清楚 · 买卖完整留痕</p></div></div><div class="actions"><button id="import">导入记录</button><button id="export">导出我的记录 ↗</button><input id="importFile" type="file" accept=".json" hidden></div></header>
<main><nav id="mainNav" aria-label="主导航"><button data-view="desk" class="selected">投资看板</button><button data-view="sentiment">市场情绪</button><button data-view="tools">收益工具</button><button data-view="strategy">策略复盘</button></nav>
<div class="notice"><span><i class="dot"></i><b>收盘自动更新</b> · A股交易日15:30（北京时间）；美股收盘后30分钟</span><span>夏令时与提前收盘按交易日历处理 · 任务可能排队 · 数据未到齐保留原日期</span></div><div class="update-status" id="updateStatus" role="status"></div>
<div id="board"><nav id="subNav" aria-label="看板导航"><button data-view="desk" class="selected">买卖决策台</button><button data-view="review">成交记录</button></nav></div>
<section id="desk"><div class="selection-bar"><div><span class="eyebrow">选择指数，查看当日行动</span><h2>每日买卖决策</h2><small>每日收盘数据 · 非实时行情</small></div><div class="selector-controls"><div class="segmented"><button data-market="cn">A股 · 5指数</button><button data-market="us">美股 · 2指数</button></div><label class="index-picker" for="indexSelect"><span>当前决策指数 ▾</span><select id="indexSelect" aria-label="选择指数"></select></label></div></div>
<section id="decision" class="decision"></section><section id="account" class="account"></section><div id="indexCard"></div>
<div class="workspace"><div class="main-column"><section id="plans" class="panel"></section><section id="chart" class="panel"></section></div><aside><section id="trade" class="panel"></section><section id="positions" class="panel"></section></aside></div>
<section class="panel"><div class="panel-head"><h2>最近成交</h2><button data-view="review">查看全部 →</button></div><div id="recent"></div></section><details class="panel" id="rules"><summary>规则与数据 · 参数设置、收盘口径、历史核查</summary><div id="rulesBody"></div></details></section>
<section id="review" class="panel" hidden></section><section id="strategy" class="panel" hidden></section><section id="legacy" hidden><p class="notice">原有工具独立运行；定投结果不参与买卖决策台。这里保留原版数据与更新时间说明。</p><iframe id="legacyFrame" title="市场情绪与收益工具" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe></section>
<footer><span>本地记录 · 不计交易手续费 · 不自动下单</span><span>V8 · R1 / 收盘研究版 · 2026.10</span></footer></main>
<dialog id="dialog"><div class="modal-head"><h2 id="dialogTitle"></h2><button data-close="dialog" aria-label="关闭弹窗">×</button></div><div id="dialogBody"></div></dialog><dialog id="zoom" aria-label="放大的历史走势图"><div class="modal-head"><b>关键点位 · 放大查看</b><button data-close="zoom">关闭 ×</button></div><div id="zoomBody"></div></dialog><div id="toast" role="status"></div>
<script src="live-data.js"></script><script src="core.js"></script><script src="r1-core.js"></script><script src="app.js"></script></body></html>
